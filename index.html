<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELIAS">
<meta name="theme-color" content="#02060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ELIAS Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap">
<style>
/* Layout: one phone-sized column. Wordmark on top, the core fills the middle, state controls sit at the thumb. */
:root {
  --bg: #02060f;
  --bg-glow: #07173a;
  --ink: #eaf8ff;
  --muted: #7fb3d6;
  --blue: #1e6bff;
  --cyan: #19d3ff;
  --ice: #8ff1ff;
  --line: rgba(25, 211, 255, 0.28);
  --panel: rgba(6, 19, 43, 0.72);
  --display: 'Orbitron', 'Eurostile', 'Bank Gothic', 'Arial Narrow', sans-serif;
  --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(120% 70% at 50% 42%, var(--bg-glow) 0%, transparent 70%);
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.stage {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px 12px;
  display: grid;
  grid-template-rows: auto auto minmax(250px, 1fr) auto auto auto;
  gap: 8px;
}
header { text-align: center; }
h1 {
  margin: 0;
  font: 700 clamp(26px, 8.5vw, 38px) / 1 var(--display);
  letter-spacing: 0.46em;
  padding-left: 0.46em;
  color: var(--ice);
  text-shadow: 0 0 18px rgba(25, 211, 255, 0.55);
}
header p {
  margin: 6px 0 0;
  font: 500 11px / 1 var(--display);
  letter-spacing: 0.34em;
  padding-left: 0.34em;
  color: var(--muted);
}
.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 28px;
  font: 600 19px / 1.2 var(--body);
  letter-spacing: 0.04em;
  color: var(--ink);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}
.status[data-state="thinking"] .dot { animation: blink 0.9s steps(2, end) infinite; }
.status[data-state="locked"] .dot { background: #f5b83d; box-shadow: 0 0 10px #f5b83d; }
@keyframes blink { 50% { opacity: 0.25; } }
.core-wrap { position: relative; min-height: 0; }
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
  cursor: pointer;
}
.prompt {
  margin: 0;
  min-height: 2.7em;
  text-align: center;
  font: 500 16px / 1.35 var(--body);
  color: var(--muted);
  text-wrap: balance;
}
.states {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.states button {
  min-height: 46px;
  padding: 0 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font: 600 13px / 1 var(--body);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.states button[aria-pressed="true"] {
  color: var(--ice);
  border-color: var(--cyan);
  box-shadow: 0 0 14px rgba(25, 211, 255, 0.35), inset 0 0 12px rgba(25, 211, 255, 0.12);
}
.states button:focus-visible, canvas:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.note {
  margin: 0;
  text-align: center;
  font: 500 12px / 1.3 var(--body);
  letter-spacing: 0.04em;
  color: var(--muted);
  opacity: 0.8;
}
</style>

<main class="stage">
  <header>
    <h1>ELIAS</h1>
    <p>AI CORE</p>
  </header>
  <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">ELIAS is ready</span>
  </div>
  <div class="core-wrap">
    <canvas id="core" tabindex="0" role="button" aria-label="ELIAS core. Tap to move to the next state."></canvas>
  </div>
  <p class="prompt" id="prompt">Tap the core or say "Wake up, ELIAS"</p>
  <nav class="states" id="states" aria-label="Core state">
    <button type="button" id="b-idle" data-state="idle" aria-pressed="true">Idle</button>
    <button type="button" id="b-listening" data-state="listening" aria-pressed="false">Listen</button>
    <button type="button" id="b-thinking" data-state="thinking" aria-pressed="false">Think</button>
    <button type="button" id="b-speaking" data-state="speaking" aria-pressed="false">Speak</button>
    <button type="button" id="b-locked" data-state="locked" aria-pressed="false">Lock</button>
  </nav>
  <p class="note">Prototype. Audio levels are simulated and nothing is connected to ELIAS yet.</p>
</main>

<script>
(function () {
  var cv = document.getElementById('core');
  var ctx = cv.getContext('2d');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var promptEl = document.getElementById('prompt');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('#states button'));
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var motion = reduce ? 0.3 : 1;

  var STATES = {
    idle:      { text: 'ELIAS is ready',      prompt: 'Tap the core or say "Wake up, ELIAS"' },
    listening: { text: 'Listening…',      prompt: 'Your voice activates ELIAS. The core responds.' },
    thinking:  { text: 'Thinking…',       prompt: 'Processing your request. Analysing. Planning.' },
    speaking:  { text: 'ELIAS is speaking…', prompt: 'Real voice. Real responses. Always with you.' },
    locked:    { text: 'Privacy mode',        prompt: 'Locked. Your privacy, your control. Tap to unlock.' }
  };
  var ORDER = ['idle', 'listening', 'thinking', 'speaking'];

  // Target look per state; the live values glide toward these.
  var TARGET = {
    idle:      { spin: 0.10, jitter: 0.010, pulse: 0.020, glow: 0.70, rings: 0.55, links: 0, bars: 0.10, lock: 0, wave: 0.0 },
    listening: { spin: 0.22, jitter: 0.020, pulse: 0.150, glow: 1.00, rings: 0.85, links: 0, bars: 1.00, lock: 0, wave: 0.6 },
    thinking:  { spin: 0.95, jitter: 0.055, pulse: 0.030, glow: 0.92, rings: 0.40, links: 1, bars: 0.25, lock: 0, wave: 0.0 },
    speaking:  { spin: 0.30, jitter: 0.030, pulse: 0.170, glow: 1.12, rings: 0.80, links: 0, bars: 1.00, lock: 0, wave: 1.0 },
    locked:    { spin: 0.04, jitter: 0.004, pulse: 0.010, glow: 0.40, rings: 0.30, links: 0, bars: 0.00, lock: 1, wave: 0.0 }
  };
  var cur = JSON.parse(JSON.stringify(TARGET.idle));
  var state = 'idle';

  var W = 1, H = 1, DPR = 1, cx = 0, cy = 0, R = 100;
  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width);
    H = Math.max(1, r.height);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.min(W * 0.44, H * 0.40);
    cx = W / 2;
    cy = H * 0.46;
  }

  // Soft glow sprite, drawn once and stamped for every particle.
  var sprite = document.createElement('canvas');
  sprite.width = sprite.height = 64;
  (function () {
    var g = sprite.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(143,241,255,0.85)');
    grad.addColorStop(0.6, 'rgba(25,150,255,0.25)');
    grad.addColorStop(1, 'rgba(25,100,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
  })();

  // Particles sit on a disc; inner ones orbit faster.
  var N = 760, P = [], i;
  for (i = 0; i < N; i++) {
    P.push({
      a: Math.random() * Math.PI * 2,
      r: 0.10 + Math.pow(Math.random(), 0.75) * 0.90,
      s: Math.random(),
      b: 0.35 + Math.random() * 0.65,
      k: Math.random() * 6.28,
      d: Math.random() < 0.5 ? -1 : 1
    });
  }
  var NODES = 44;

  function level(t, amount) {
    var s = Math.sin(t * 7.3) * 0.5 + 0.5;
    var s2 = Math.sin(t * 13.1 + 1.7) * 0.5 + 0.5;
    var s3 = Math.sin(t * 2.1) * 0.5 + 0.5;
    var v = (0.25 + 0.6 * s * s2) * (0.55 + 0.45 * s3);
    return Math.min(1, v) * amount + (1 - amount) * 0.12;
  }

  function shieldPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.bezierCurveTo(x + s * 0.35, y - s * 0.85, x + s * 0.75, y - s * 0.8, x + s * 0.8, y - s * 0.7);
    ctx.lineTo(x + s * 0.8, y + s * 0.05);
    ctx.bezierCurveTo(x + s * 0.8, y + s * 0.55, x + s * 0.35, y + s * 0.85, x, y + s);
    ctx.bezierCurveTo(x - s * 0.35, y + s * 0.85, x - s * 0.8, y + s * 0.55, x - s * 0.8, y + s * 0.05);
    ctx.lineTo(x - s * 0.8, y - s * 0.7);
    ctx.bezierCurveTo(x - s * 0.75, y - s * 0.8, x - s * 0.35, y - s * 0.85, x, y - s);
    ctx.closePath();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  var tpos = [];
  function frame(t, dt) {
    var k = 1 - Math.exp(-dt * 4.5), key;
    var T = TARGET[state];
    for (key in T) { cur[key] += (T[key] - cur[key]) * k; }

    var drive = (state === 'listening' || state === 'speaking') ? 1 : 0.15;
    var lvl = level(t, drive);
    var calm = 1 - cur.lock;

    ctx.clearRect(0, 0, W, H);

    // Central glow
    var gr = R * (0.42 + 0.10 * lvl * cur.pulse * 6);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr * 2.2);
    g.addColorStop(0, 'rgba(200,245,255,' + (0.75 * cur.glow * calm).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(25,160,255,' + (0.46 * cur.glow * calm).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(10,60,200,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - gr * 2.3, cy - gr * 2.3, gr * 4.6, gr * 4.6);

    // Rings
    ctx.save();
    ctx.lineWidth = 1;
    var radii = [0.30, 0.52, 0.74, 0.92, 1.04], j;
    for (j = 0; j < radii.length; j++) {
      var rad = R * radii[j] * (1 + cur.pulse * 0.5 * lvl * (j % 2 ? 1 : -1) * calm);
      ctx.strokeStyle = 'rgba(40,170,255,' + (0.50 * cur.rings * (j === 4 ? 0.6 : 1)).toFixed(3) + ')';
      ctx.setLineDash(j % 2 ? [2, 7] : [28, 10, 4, 10]);
      ctx.lineDashOffset = -t * (14 + j * 6) * (j % 2 ? -1 : 1) * motion;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();

    // Particles
    ctx.globalCompositeOperation = 'lighter';
    var scale = R / 150, ang, rad2, x, y, size, wob, ripple;
    for (i = 0; i < N; i++) {
      var p = P[i];
      ang = p.a + t * cur.spin * motion * p.d / (0.35 + p.r);
      wob = Math.sin(t * 3 + p.k) * cur.jitter;
      ripple = Math.sin(p.r * 12 - t * 5.5 * (0.6 + cur.wave)) * cur.pulse * (0.5 + lvl) * (0.6 + cur.wave * 0.6);
      rad2 = R * p.r * (1 + wob + ripple) * (1 - 0.55 * cur.lock);
      x = cx + Math.cos(ang) * rad2;
      y = cy + Math.sin(ang) * rad2;
      size = (3.5 + p.s * 8) * scale * (0.8 + cur.glow * 0.3);
      ctx.globalAlpha = Math.min(1, (0.26 + 0.70 * p.b) * cur.glow * (1 - 0.6 * cur.lock));
      ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
      if (i < NODES) { tpos[i] = [x, y]; }
    }
    ctx.globalAlpha = 1;

    // Thinking: links between nearby nodes
    if (cur.links > 0.03) {
      ctx.lineWidth = 1;
      var maxd = R * 0.55, a, b, dx, dy, d;
      for (a = 0; a < NODES; a++) {
        for (b = a + 1; b < NODES; b++) {
          dx = tpos[a][0] - tpos[b][0];
          dy = tpos[a][1] - tpos[b][1];
          d = Math.sqrt(dx * dx + dy * dy);
          if (d < maxd) {
            ctx.strokeStyle = 'rgba(143,241,255,' + ((1 - d / maxd) * 0.55 * cur.links).toFixed(3) + ')';
            ctx.beginPath();
            ctx.moveTo(tpos[a][0], tpos[a][1]);
            ctx.lineTo(tpos[b][0], tpos[b][1]);
            ctx.stroke();
          }
        }
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    // Bright core point
    var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.16);
    cg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * calm).toFixed(3) + ')');
    cg.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.16, 0, Math.PI * 2);
    ctx.fill();

    // Locked: shield and padlock
    if (cur.lock > 0.02) {
      var s = R * 0.52, al = cur.lock;
      ctx.save();
      ctx.shadowColor = 'rgba(25,211,255,' + al.toFixed(3) + ')';
      ctx.shadowBlur = 22;
      shieldPath(cx, cy, s);
      ctx.fillStyle = 'rgba(25,211,255,' + (0.08 * al).toFixed(3) + ')';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(143,241,255,' + (0.95 * al).toFixed(3) + ')';
      ctx.stroke();
      ctx.shadowBlur = 0;
      var bw = s * 0.62, bh = s * 0.46, bx = cx - bw / 2, by = cy - bh * 0.1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, by, bw * 0.30, Math.PI, 0);
      ctx.stroke();
      rr(bx, by, bw, bh, 5);
      ctx.fillStyle = 'rgba(8,40,90,' + (0.9 * al).toFixed(3) + ')';
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(143,241,255,' + al.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(cx, by + bh * 0.45, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Waveform under the core
    var wy = H * 0.915, bars = 37, span = Math.min(W * 0.86, 360), step = span / (bars - 1), q, env, hgt;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, step * 0.42);
    for (q = 0; q < bars; q++) {
      var u = q / (bars - 1);
      env = Math.pow(Math.sin(u * Math.PI), 1.6);
      var live = lvl * (0.45 + 0.55 * Math.abs(Math.sin(t * 9 + q * 0.9) * Math.cos(t * 4.3 + q * 0.37)));
      var idleBar = 0.05 + 0.05 * Math.sin(t * 2 + q * 0.5);
      hgt = (idleBar * (1 - cur.bars) + live * cur.bars + idleBar * cur.bars * 0.2) * env;
      hgt = Math.max(1.5, hgt * H * 0.075 * 2);
      ctx.strokeStyle = 'rgba(40,190,255,' + (0.25 + 0.7 * env) * (1 - cur.lock) + ')';
      var px = cx - span / 2 + q * step;
      ctx.beginPath();
      ctx.moveTo(px, wy - hgt / 2);
      ctx.lineTo(px, wy + hgt / 2);
      ctx.stroke();
    }
  }

  function setState(next) {
    if (!STATES[next]) { return; }
    state = next;
    statusText.textContent = STATES[next].text;
    promptEl.textContent = STATES[next].prompt;
    statusEl.setAttribute('data-state', next);
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-state') === next ? 'true' : 'false');
    });
  }
  function advance() {
    if (state === 'locked') { setState('idle'); return; }
    setState(ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]);
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setState(b.getAttribute('data-state')); });
  });
  cv.addEventListener('click', advance);
  cv.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); }
  });

  var last = 0, running = true;
  function loop(ms) {
    if (!running) { return; }
    var t = ms / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
    last = t;
    frame(t, dt);
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; last = 0; requestAnimationFrame(loop); }
  });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);

  // Lets a test page jump straight to a state: #listening, #thinking, ...
  var h = (location.hash || '').replace('#', '');
  if (STATES[h]) { setState(h); for (var key in TARGET[h]) { cur[key] = TARGET[h][key]; } }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
